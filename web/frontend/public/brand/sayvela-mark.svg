<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sayvela">
  <!--
    Sayvela — dấu hiệu "nét bút".
    Hai nét là bản sao quay 180° của nhau quanh tâm (32,32): nét trên là kênh
    âm thanh hệ thống, nét dưới là micro. Nền trong suốt, màu tự đổi theo
    giao diện của trình duyệt nên dùng được cả trên giấy lẫn trên nền tối.
  -->
  <style>
    .sys { fill: #1f3f66; }
    .mic { fill: #935c11; }
    @media (prefers-color-scheme: dark) {
      .sys { fill: #7fa7f5; }
      .mic { fill: #f3a950; }
    }
  </style>
  <path class="sys" d="M9 25C19 10 39 7 55 14c-9 4-16 7-23 13-7 6-16 6-23-2z" />
  <path class="mic" d="M55 39C45 54 25 57 9 50c9-4 16-7 23-13 7-6 16-6 23 2z" />
</svg>
