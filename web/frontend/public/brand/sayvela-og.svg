  <text x="235" y="98" fill="#eceef0" font-family="Arial Narrow, Arial, Helvetica, sans-serif"
        font-size="34" font-weight="bold" letter-spacing="3.4">SAYVELA</text>

  <!-- luận đề -->
  <text x="140" y="248" fill="#eceef0" font-family="Arial Narrow, Arial, Helvetica, sans-serif"
        font-size="64" font-weight="bold">They speak theirs.</text>
  <text x="140" y="318" fill="#eceef0" font-family="Arial Narrow, Arial, Helvetica, sans-serif"
        font-size="64" font-weight="bold">You speak yours.</text>
  <text x="140" y="388" fill="#f3a950" font-family="Arial Narrow, Arial, Helvetica, sans-serif"
        font-size="64" font-weight="bold">Nobody waits.</text>

  <!-- dải chân -->
  <text x="140" y="570" fill="#9aa2aa" font-family="Consolas, Menlo, monospace"
        font-size="21" letter-spacing="1.4">THEIR WORDS AS TEXT · YOUR WORDS SPOKEN ALOUD</text>

  <!-- đo mức hai làn -->
