<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0b0c0e" />

  <!-- vạch chia mảnh, gợi thang đo -->
  <g stroke="#23272d" stroke-width="1">
    <line x1="0" y1="118" x2="1200" y2="118" />
    <line x1="0" y1="512" x2="1200" y2="512" />
    <line x1="92" y1="0" x2="92" y2="630" />
  </g>

  <!-- mark -->
  <g transform="translate(140 58) scale(1.25)">
    <path d="M9 25C19 10 39 7 55 14c-9 4-16 7-23 13-7 6-16 6-23-2z" fill="#7fa7f5" />
    <path d="M55 39C45 54 25 57 9 50c9-4 16-7 23-13 7-6 16-6 23 2z" fill="#f3a950" />
