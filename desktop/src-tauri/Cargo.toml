[package]
name = "sayvela"
version = "0.1.0"
description = "Words are like sails - cross language barriers effortlessly with real-time voice translation and transcription"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sayvela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
tauri-plugin-mcp-bridge = "0.12"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
base64 = "0.22"
dotenvy = "0.15"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
xcap = { version = "0.9.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(windows)'.dependencies]
wasapi = "0.17"
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_SpeechSynthesis", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
