<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      /* a hollow frame: only the border is painted, the middle stays see-through */
      .frame {
        position: fixed;
        inset: 0;
        border: 4px solid #ff3b3b;
        box-sizing: border-box;
        box-shadow: inset 0 0 10px rgba(255, 59, 59, 0.22);
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
  </body>
</html>
